name: Build & Release LiveRecorder

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================
  # 编译任务
  # ============================================
  build:
    runs-on: ubuntu-latest
    name: Build (${{ matrix.name }})

    strategy:
      matrix:
        include:
          - name: legacy-spigot-1.16
            profile: legacy-116
          - name: paper-26.3
            profile: paper-263
      fail-fast: false

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for changelog generation

      # Paper 26.3 API classes are Java 25; plugin output stays Java 8.
      - name: ☕ Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Build and test with Maven
        run: mvn -P${{ matrix.profile }} clean verify -B -V

      - name: ✅ Verify Java 8 plugin bytecode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          classes = list(Path("target/classes").rglob("*.class"))
          if not classes:
              raise SystemExit("no main class files found")
          majors = {struct.unpack(">H", p.read_bytes()[6:8])[0] for p in classes}
          print(f"main class count={len(classes)} major versions={sorted(majors)}")
          if majors != {52}:
              raise SystemExit(f"expected Java 8 major 52, got {sorted(majors)}")
          PY

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveRecorder-${{ matrix.name }}-${{ github.run_number }}
          path: target/LiveRecorder-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: 📊 Build summary
        run: |
          echo "## 🔨 Build Complete (${{ matrix.name }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Compiler JDK**: 25" >> $GITHUB_STEP_SUMMARY
          echo "- **Plugin bytecode**: Java 8 (major 52)" >> $GITHUB_STEP_SUMMARY
          echo "- **API profile**: ${{ matrix.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          ls -lh target/*.jar | awk '{print "- "$NF" ("$5")"}' >> $GITHUB_STEP_SUMMARY

  velocity:
    runs-on: ubuntu-latest
    name: Velocity build
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      - name: ☕ Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: 🔨 Build and test Velocity module
        run: mvn -f velocity/pom.xml clean verify -B -V
      - name: ✅ Verify Java 17 proxy bytecode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          classes = list(Path("velocity/target/classes").rglob("*.class"))
          if not classes:
              raise SystemExit("no Velocity class files found")
          majors = {struct.unpack(">H", p.read_bytes()[6:8])[0] for p in classes}
          print(f"Velocity class count={len(classes)} major versions={sorted(majors)}")
          if majors != {61}:
              raise SystemExit(f"expected Java 17 major 61, got {sorted(majors)}")
          PY

  # ============================================
  # 发布任务 - 仅在推送 tag 时触发
  # ============================================
  release:
    needs: [build, velocity]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    name: Create Release

    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Build with Maven
        run: mvn -Ppaper-263 clean package -B -V -DskipTests

      - name: 📋 Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "major=$(echo ${TAG#v} | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "minor=$(echo ${TAG#v} | cut -d. -f2)" >> $GITHUB_OUTPUT
          echo "patch=$(echo ${TAG#v} | cut -d. -f3)" >> $GITHUB_OUTPUT

      - name: 📝 Generate changelog
        id: changelog
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # 没有上一个 tag，获取所有提交
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
            CHANGELOG_TITLE="🎉 Initial Release"
          else
            # 获取两个 tag 之间的提交
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)

            # 分类提交类型
            FEATURES=$(git log ${PREV_TAG}..HEAD --grep="^feat" --pretty=format:"- %s (%h)" --no-merges || true)
            FIXES=$(git log ${PREV_TAG}..HEAD --grep="^fix" --pretty=format:"- %s (%h)" --no-merges || true)
            DOCS=$(git log ${PREV_TAG}..HEAD --grep="^docs" --pretty=format:"- %s (%h)" --no-merges || true)
            REFACTOR=$(git log ${PREV_TAG}..HEAD --grep="^refactor" --pretty=format:"- %s (%h)" --no-merges || true)
            CHORE=$(git log ${PREV_TAG}..HEAD --grep="^chore" --pretty=format:"- %s (%h)" --no-merges || true)

            CHANGELOG_TITLE="📦 What's Changed"
          fi

          # 生成更新日志
          cat > changelog.md << EOF
          ## $CHANGELOG_TITLE

          ### All Changes
          $COMMITS

          ---

          **Full Changelog**: [\`${PREV_TAG:-initial}...${{ steps.version.outputs.tag }}\`](https://github.com/${{ github.repository }}/compare/${PREV_TAG:-initial}...${{ steps.version.outputs.tag }})
          EOF

          # 输出到 GitHub Actions
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "LiveRecorder ${{ steps.version.outputs.tag }}"
          body: |
            ## 🎥 LiveRecorder ${{ steps.version.outputs.tag }}

            ### 📦 Installation
            1. Download `LiveRecorder-${{ steps.version.outputs.version }}.jar` below
            2. Place it in your server's `plugins/` directory
            3. Restart your server

            ### 📋 ${{ steps.changelog.outputs.changelog }}

            ### ⚙️ Compatibility
            - **Server**: Spigot / Paper 1.16+
            - **Java**: 8+
            - **Maven**: 3.6+

            ### 📚 Documentation
            - [Online Docs](https://lr.hosh.dev)
            - [README](https://github.com/${{ github.repository }}#readme)
            - [Changelog](https://github.com/${{ github.repository }}/blob/main/help/CHANGELOG.md)

            ---
            Made with ❤️ by 七月个人制作组
          files: target/LiveRecorder-*.jar
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Release summary
        run: |
          echo "## 🎉 Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release URL**: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Published at**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
